name: Hotel module isolated tests
on:
  push:
    branches:
      - feature/hotel-module-v1
  pull_request:
    branches:
      - feature/orders-v1
permissions:
  contents: read
jobs:
  test-hotel-module:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qr_hotel_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qr_hotel_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/qr_hotel_ci
      ENABLE_HOTEL_MODULE: "true"
      ENABLE_WEB_ORDERS: "true"
      ADMIN_SESSION_SECRET: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      QR_MENU_EPHEMERAL_DB_TEST: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Existing restaurant unit regressions
        run: npm run test:orders
      - name: Hotel unit tests
        run: node --experimental-strip-types --test tests/hotel-module.test.mjs
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Apply migrations to disposable CI database
        run: npx prisma migrate deploy
      - name: Compare DB against schema
        run: npx prisma db push --skip-generate
      - name: Hotel DB isolation tests
        run: node --experimental-strip-types --test tests/integration/hotel-isolation-db.test.mjs
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Next.js build
        run: npm run build
      - name: Install disposable Chromium and WebKit test browsers
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: End-to-end hotel QR, guest, departments and isolation in Chromium
        run: node --experimental-strip-types --test tests/integration/hotel-browser-e2e.test.mjs
      - name: iOS-like WebKit test of guest QR, staff isolation and folio
        run: HOTEL_E2E_BROWSER=webkit node --experimental-strip-types --test tests/integration/hotel-browser-e2e.test.mjs
      - name: Seed disposable hotel folio for independent backup restoration
        run: node --experimental-strip-types scripts/seed-hotel-restore-ci.mjs
      - name: Verify hotel backup and independent PostgreSQL restore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qr-hotel-ci-backup"
          trap 'rm -rf "$RUNNER_TEMP/qr-hotel-ci-backup"' EXIT
          docker run --rm --network host \
            -e PGPASSWORD=postgres -v "$RUNNER_TEMP/qr-hotel-ci-backup:/backups" \
            postgres:16-alpine pg_dump --host=127.0.0.1 --username=postgres \
            --dbname=qr_hotel_ci --format=custom --no-owner \
            --file=/backups/qr-hotel-ci.backup
          docker run --rm --network host -e PGPASSWORD=postgres \
            postgres:16-alpine psql --host=127.0.0.1 --username=postgres \
            --dbname=postgres --set=ON_ERROR_STOP=1 \
            --command='CREATE DATABASE qr_hotel_restore_ci'
          docker run --rm --network host \
            -e PGPASSWORD=postgres -v "$RUNNER_TEMP/qr-hotel-ci-backup:/backups" \
            postgres:16-alpine pg_restore --host=127.0.0.1 --username=postgres \
            --dbname=qr_hotel_restore_ci --no-owner --exit-on-error \
            /backups/qr-hotel-ci.backup
          node --experimental-strip-types --test tests/integration/hotel-backup-restore-ci.test.mjs
