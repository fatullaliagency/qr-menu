name: Staging order policy tests

on:
  push:
    branches:
      - feature/orders-v1
  pull_request:
    branches:
      - feature/orders-v1

permissions:
  contents: read

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    # Disposable PostgreSQL service: never the staging or production database.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qr_menu_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qr_menu_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/qr_menu_ci
      QR_MENU_EPHEMERAL_DB_TEST: "true"
      ENABLE_WEB_ORDERS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm install
      - run: npm run test:orders
      - name: Generate Prisma Client for disposable database tests
        run: npx prisma generate
      - name: Apply tracked SQL migrations in disposable CI database only
        run: npx prisma migrate deploy
      - name: Verify Prisma schema matches applied migrations in disposable CI
        run: npx prisma db push --skip-generate
      - name: Test order uniqueness and tenant isolation against PostgreSQL
        run: npm run test:orders:db
      - name: Generate disposable HTTP signing key
        run: echo "ADMIN_SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Compile Next.js for localhost API smoke tests
        run: npm run build
      - name: Verify anonymous, tracked and tenant-scoped HTTP routes
        run: npm run test:orders:http
      - name: Install disposable Chromium browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test customer checkout, restaurant PIN, alerts and status in Chromium
        run: npm run test:orders:browser
      - name: Dump disposable CI PostgreSQL and restore into a separate ephemeral database
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qr-ci-backup"
          trap 'rm -rf "$RUNNER_TEMP/qr-ci-backup"' EXIT
          docker run --rm --network host \
            -e PGPASSWORD=postgres -v "$RUNNER_TEMP/qr-ci-backup:/backups" \
            postgres:16-alpine pg_dump --host=127.0.0.1 --username=postgres \
            --dbname=qr_menu_ci --format=custom --no-owner \
            --file=/backups/qr-menu-ci.backup
          docker run --rm --network host -e PGPASSWORD=postgres \
            postgres:16-alpine psql --host=127.0.0.1 --username=postgres \
            --dbname=postgres --set=ON_ERROR_STOP=1 \
            --command='CREATE DATABASE qr_menu_restore_ci'
          docker run --rm --network host \
            -e PGPASSWORD=postgres -v "$RUNNER_TEMP/qr-ci-backup:/backups" \
            postgres:16-alpine pg_restore --host=127.0.0.1 --username=postgres \
            --dbname=qr_menu_restore_ci --no-owner --exit-on-error \
            /backups/qr-menu-ci.backup
          npm run test:orders:restore

